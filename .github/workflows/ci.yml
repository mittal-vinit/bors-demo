name: CI
on: [push, pull_request]

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: build
        run: |
          if [ -f FAIL ]; then echo "failing (FAIL file)"; exit 1; fi
          if [ "${{ vars.FORCE_FAIL }}" = "true" ]; then echo "failing (FORCE_FAIL var)"; exit 1; fi
          echo ok
